<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You — APYIN Osun</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #D0021B;
      --red-light: #FF1A35;
      --red-pale: #FFF0F2;
      --green: #1A6B3A;
      --cream: #FDFAF5;
      --warm-white: #FFFEF9;
      --charcoal: #1C1C1C;
      --mid: #5A5A5A;
      --border: #E8E0D6;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .thankyou-card {
      background: #fff;
      border-radius: 24px;
      padding: 64px 48px;
      max-width: 520px;
      width: 100%;
      border: 1px solid var(--border);
      box-shadow: 0 8px 48px rgba(0,0,0,0.06);
    }

    .thankyou-icon {
      width: 80px;
      height: 80px;
      background: var(--red-pale);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 2.5rem;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--charcoal);
      margin-bottom: 12px;
    }

    h1 em { color: var(--red); font-style: italic; }

    p {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--mid);
      margin-bottom: 32px;
    }

    .btn-primary {
      background: var(--red); color: #fff;
      padding: 14px 32px; border-radius: 100px;
      font-weight: 600; font-size: 0.95rem;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(208,2,27,0.3);
    }
    .btn-primary:hover { background: var(--red-light); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(208,2,27,0.35); }

    .contact-info {
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }
    .contact-info p {
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    .contact-info a {
      color: var(--red);
      text-decoration: none;
      font-weight: 600;
    }
    .contact-info a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="thankyou-card">
    <div class="thankyou-icon">🎗️</div>
    <h1>Message <em>Sent!</em></h1>
    <p>Thank you for reaching out to APYIN Osun. We've received your message and a member of our team will get back to you within 48 hours.</p>
    <a href="index.html" class="btn-primary">Back to Home →</a>
    <div class="contact-info">
      <p>Need to reach us sooner?</p>
      <p><a href="mailto:apyinosun@gmail.com">apyinosun@gmail.com</a></p>
    </div>
  </div>
</body>
</html>
